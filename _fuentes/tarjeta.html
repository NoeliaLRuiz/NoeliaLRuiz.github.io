<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400..700&family=Source+Serif+4:opsz,wght@8..60,600..700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; align-items: center; gap: 56px; padding: 0 80px; box-sizing: border-box;
    background: linear-gradient(120deg, #fbf6f2 0%, #f1e2da 45%, #e2c4bd 100%);
    font-family: "Public Sans", sans-serif; color: #2b1d20;
  }
  img { width: 250px; height: 250px; border-radius: 50%; object-fit: cover; border: 8px solid #fffbf8; box-shadow: 0 14px 40px rgba(70, 22, 31, .22); flex: none; }
  h1 { font: 700 64px/1.05 "Source Serif 4", Georgia, serif; margin: 0 0 18px; }
  .rol { font-size: 30px; font-weight: 600; color: #7a2e3a; margin: 0 0 10px; }
  .temas { font-size: 25px; color: #6b5157; margin: 0; }
  .barra { width: 110px; height: 7px; border-radius: 4px; background: linear-gradient(90deg, #e2c4bd, #7a2e3a); margin: 0 0 26px; }
  .url { position: absolute; left: 80px; right: 80px; bottom: 0; height: 64px; display: flex; align-items: center; justify-content: space-between; color: #f6e6e2; font-size: 22px; }
  .pie { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: linear-gradient(135deg, #46161f, #7a2e3a); }
</style>
</head>
<body>
  <img src="../images/foto.jpg" alt="">
  <div>
    <div class="barra"></div>
    <h1>Noelia Fernanda<br>Leon Ruiz</h1>
    <p class="rol">Especialista en Presupuesto</p>
    <p class="temas">Presupuesto público · Ciencia de datos con Python y R</p>
  </div>
  <div class="pie"></div>
  <div class="url"><span>noelialruiz.github.io</span><span>Lima, Perú</span></div>
</body>
</html>
